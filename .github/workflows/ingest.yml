name: ingest
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (UTC)
  workflow_dispatch:
concurrency:
  group: ingest
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - name: Pull the live database (GitHub Release asset `data/hkia.db`; the db is not in git — see src/hkia/dbsync.py)
        run: PYTHONPATH=src python -m hkia.dbsync pull     # fatal on purpose: never ingest into a blank db and then push it
      - name: Ingest flights + arrivals + weather
        run: python scripts/ingest_all.py
      - name: ADS-B snapshot (~55 aircraft within 100 nm -> adsb_snapshots, pruned to 30 days)
        run: PYTHONPATH=src python -m hkia.ingest_adsb
        continue-on-error: true      # a flaky free ADS-B feed must never cost us a flights/predict run
      - name: Link inbound aircraft to departures (-> aircraft_links; yesterday + today, idempotent)
        run: PYTHONPATH=src python -m hkia.rotations
        continue-on-error: true
      - name: Score today + tomorrow (-> predictions table)
        run: PYTHONPATH=src python -m hkia.predict
      - name: Export JSON snapshots for the static web app (web/public/data/)
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src python -m hkia.export_json
      - name: Push the database back to the release (quick_check + row-count guard inside; single writer via the concurrency group)
        if: ${{ !cancelled() }}   # save whatever landed even if a step above failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m hkia.dbsync push
      - name: Commit JSON snapshots
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ingest: $(date -u +%Y-%m-%dT%H:%MZ)"
          # a human may have pushed meanwhile; our JSON is the newer snapshot, so keep it on conflict
          git pull --rebase -X theirs
          git push
          # (a push made with GITHUB_TOKEN does not trigger pages.yml — by design: the web app reads the JSON straight from
          #  raw.githubusercontent.com/main, so no Pages rebuild is needed for fresh data; see docs/deploy.md)
