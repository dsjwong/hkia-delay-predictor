name: ingest
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (UTC)
  workflow_dispatch:
concurrency:
  group: ingest
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest flights + weather
        run: python scripts/ingest_all.py
      - name: Score today + tomorrow (-> predictions table)
        run: PYTHONPATH=src python -m hkia.predict
      - name: Commit DB
        if: ${{ !cancelled() }}   # commit whatever landed even if a step above failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hkia.db
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ingest: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
