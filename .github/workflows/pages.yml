name: pages
# Build the static web app (web/, Vite + React) and deploy it to GitHub Pages.
# Triggers: a human push touching web/** (the bot's data commits are made with GITHUB_TOKEN and therefore do NOT trigger
# this workflow — intended: the deployed site fetches web/public/data/*.json from raw.githubusercontent.com/main at runtime,
# so fresh data needs no rebuild; the copy bundled under /data/ is only the offline fallback), or a manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # jsdom 30 / vitest 4 need Node >= 22 (undici markAsUncloneable); 20 fails in npm test
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Smoke — built index.html has the app root
        run: grep -q 'id="root"' dist/index.html && test -f dist/data/meta.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
