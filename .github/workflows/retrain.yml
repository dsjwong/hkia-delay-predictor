name: retrain
# Weekly refit of the delay models on the latest data, shipped only if a NON-INFERIORITY gate vs the currently shipped
# models passes on the candidate's held-out test window (scripts/retrain_gate.py). Reads the db (dbsync pull) and NEVER
# pushes it: the leak-free link rebuild below rewrites aircraft_links in this runner's copy only.
on:
  schedule:
    - cron: "17 3 * * 0"     # Sundays 03:17 UTC (11:17 HKT), clear of the :00/:30 ingest slots
  workflow_dispatch:
concurrency:
  group: ingest              # same group as ingest.yml: never overlaps a db pull/push, and queues instead of cancelling
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - name: Pull the live database (read only; this job never runs `dbsync push`)
        run: PYTHONPATH=src python -m hkia.dbsync pull
      - name: Rebuild inbound links from SCHEDULED times (leak-free training recipe; runner copy of the db only)
        run: PYTHONPATH=src python -m hkia.rotations --all --events sched
      - name: Rebuild the feature table
        run: PYTHONPATH=src python -m hkia.features --out "$RUNNER_TEMP/features.parquet"
      - name: Train a candidate (same inbound recipe as the shipped models; split -> calibration fold -> calibrator)
        run: |
          read -r DROPOUT MASK_SEED < <(python - <<'PY'
          import json, os
          inb = json.load(open("models/MANIFEST.json"))["inbound"]
          json.dump(inb["serve_rate"], open(os.environ["RUNNER_TEMP"] + "/serve_rate.json", "w"))
          print(inb["inbound_dropout"], inb["mask_seed"])
          PY
          )
          echo "inbound recipe of the shipped models: dropout $DROPOUT, mask seed $MASK_SEED"
          mkdir -p reports.cand && cp reports/M2-results.md reports.cand/     # train.py keeps the hand-written interpretation
          PYTHONPATH=src python -m hkia.train --features "$RUNNER_TEMP/features.parquet" --models models.cand \
            --reports reports.cand --inbound-dropout "$DROPOUT" --mask-seed "$MASK_SEED" \
            --serve-rate-json "$RUNNER_TEMP/serve_rate.json"
      - name: Non-inferiority gate vs the shipped models
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/retrain_gate.py --features "$RUNNER_TEMP/features.parquet" \
            --current models --candidate models.cand --out reports.cand/retrain-gate.json | tee gate.txt
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          { echo '### Retrain gate'; echo '```'; cat gate.txt 2>/dev/null || echo "gate did not run"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Ship (gate passed) — commit models/, MANIFEST, reports
        if: ${{ steps.gate.outcome == 'success' }}
        run: |
          cp models.cand/* models/
          cp reports.cand/M2-results.md reports/M2-results.md
          cp reports.cand/retrain-gate.json reports/retrain-gate.json
          cp gate.txt reports/retrain-gate.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models reports/M2-results.md reports/retrain-gate.json reports/retrain-gate.txt
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "retrain: weekly refit shipped ($(date -u +%Y-%m-%d)), passed the non-inferiority gate"
          git pull --rebase -X theirs
          git push
      - name: Hold (gate failed) — nothing is committed
        if: ${{ steps.gate.outcome == 'failure' }}
        run: echo "Candidate not shipped; models/ untouched. See the gate output in the job summary."
