name: backfill
on:
  schedule:
    - cron: "17 18 * * *"   # daily 18:17 UTC (02:17 HKT, quiet time between ingest runs)
  workflow_dispatch:
concurrency:
  group: ingest             # never run concurrently with the 30-min ingest (both commit data/hkia.db)
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fast-forward to the newest DB (the checkout SHA is pinned at trigger time; an ingest run queued ahead of
              us in the concurrency group may have pushed since, and -X theirs below would drop its writes)
        run: git pull --rebase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - name: Weather backfill (IEM METAR history + HKO TC signals; incremental, non-fatal on IEM 503)
        run: PYTHONPATH=src python -m hkia.backfill_weather
        continue-on-error: true
      - name: Compact predictions (first / latest / one per hour per flight; idempotent) + VACUUM
        run: PYTHONPATH=src python -m hkia.compact_predictions
      - name: Live evaluation report
        run: PYTHONPATH=src python -m hkia.evaluate
        continue-on-error: true
      - name: Commit DB + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hkia.db reports/live-eval.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "backfill: $(date -u +%Y-%m-%dT%H:%MZ)"
          # if another job pushed a newer DB meanwhile, keep this job's copy (-X theirs == our replayed commit under
          # rebase); the dropped writes are re-fetched by the next idempotent run
          git pull --rebase -X theirs
          git push
