name: backfill
on:
  schedule:
    - cron: "17 18 * * *"   # daily 18:17 UTC (02:17 HKT, quiet time between ingest runs)
  workflow_dispatch:
concurrency:
  group: ingest             # never run concurrently with the 30-min ingest (both write the release-hosted data/hkia.db)
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - name: Pull the live database (GitHub Release asset; the db is not in git — see src/hkia/dbsync.py)
        run: PYTHONPATH=src python -m hkia.dbsync pull
      - name: Weather backfill (IEM METAR history + HKO TC signals; incremental, non-fatal on IEM 503)
        run: PYTHONPATH=src python -m hkia.backfill_weather
        continue-on-error: true
      - name: Arrivals backfill (only window days that are missing or thin — self-heals gaps, ~0 requests when complete)
        run: PYTHONPATH=src python -m hkia.ingest_arrivals --fill-gaps
        continue-on-error: true
      - name: Rebuild aircraft_links over the whole window (stand_gate proxy + any ADS-B history; idempotent)
        run: PYTHONPATH=src python -m hkia.rotations --all
        continue-on-error: true
      - name: Inbound-link coverage report
        run: PYTHONPATH=src python -m hkia.rotations --coverage
        continue-on-error: true
      - name: Compact predictions (first / latest / one per hour per flight; idempotent) + VACUUM
        run: PYTHONPATH=src python -m hkia.compact_predictions
      - name: Live evaluation report
        run: PYTHONPATH=src python -m hkia.evaluate
        continue-on-error: true
      - name: Export JSON snapshots for the static web app (web/public/data/; picks up the new live-eval numbers)
        run: PYTHONPATH=src python -m hkia.export_json
        continue-on-error: true
      - name: Push the database back to the release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m hkia.dbsync push
      - name: Commit report + JSON
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/live-eval.md web/public/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "backfill: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs
          git push
